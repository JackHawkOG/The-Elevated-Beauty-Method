openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Educational Community Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Subject categories
  - name: courses
    description: Educational courses
  - name: lessons
    description: Course lessons
  - name: enrollments
    description: User course enrollments
  - name: announcements
    description: Community announcements
  - name: users
    description: User profile
  - name: dashboard
    description: Dashboard summary endpoints
  - name: method
    description: Personalized beauty method
paths:
  /membership/offer:
    get:
      operationId: getMembershipOffer
      tags: [membership]
      summary: Current founding offer availability
      responses:
        "200":
          description: Offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipOffer"
  /membership/me:
    get:
      operationId: getMyMembership
      tags: [membership]
      summary: Current membership
      responses:
        "200":
          description: Membership status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyMembership"
  /membership/confirmed-counts:
    get:
      operationId: getConfirmedMembershipCounts
      tags: [membership]
      summary: Owner-only counts of currently confirmed paid enrollments
      responses:
        "200":
          description: Confirmed founding and standard membership counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmedMembershipCounts"
        "401":
          description: Sign-in required
        "403":
          description: Owner access required
  /membership/checkout:
    post:
      operationId: createMembershipCheckout
      tags: [membership]
      summary: Start a monthly membership checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipCheckoutInput"
      responses:
        "200":
          description: Hosted checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipRedirect"
        "409":
          description: Offer not available
  /membership/portal:
    post:
      operationId: createMembershipPortal
      tags: [membership]
      summary: Manage billing and cancellation
      responses:
        "200":
          description: Hosted billing portal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipRedirect"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all subject categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List all courses with optional filters
      parameters:
        - in: query
          name: categoryId
          schema:
            type: number
          required: false
        - in: query
          name: search
          schema:
            type: string
          required: false
        - in: query
          name: difficulty
          schema:
            type: string
          required: false
        - in: query
          name: limit
          schema:
            type: number
          required: false
        - in: query
          name: offset
          schema:
            type: number
          required: false
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create a draft course (editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{courseId}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get a single course by ID
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Course detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          description: Not found
    patch:
      operationId: updateCourse
      tags: [courses]
      summary: Replace course copy and withdraw it pending owner approval (editor)
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "200":
          description: Draft course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{courseId}/approve:
    post:
      operationId: approveCourse
      tags: [courses]
      summary: Approve current course copy for publication (owner)
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorialApproval"
      responses:
        "200":
          description: Published course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{courseId}/lessons:
    get:
      operationId: listLessons
      tags: [lessons]
      summary: List lessons for a course
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Lessons list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
    post:
      operationId: createLesson
      tags: [lessons]
      summary: Add a draft lesson to a course (editor)
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonInput"
      responses:
        "201":
          description: Lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"

  /lessons/{lessonId}:
    get:
      operationId: getLesson
      tags: [lessons]
      summary: Get a single lesson
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Lesson detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "404":
          description: Not found
    patch:
      operationId: updateLesson
      tags: [lessons]
      summary: Replace lesson copy and withdraw it pending owner approval (editor)
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonInput"
      responses:
        "200":
          description: Draft lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"

  /lessons/{lessonId}/approve:
    post:
      operationId: approveLesson
      tags: [lessons]
      summary: Approve current lesson copy for publication (owner)
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorialApproval"
      responses:
        "200":
          description: Published lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"

  /editorial/courses:
    get:
      operationId: listEditorialCourses
      tags: [courses]
      summary: List courses with unpublished course or lesson drafts (editor or owner)
      responses:
        "200":
          description: Courses awaiting editorial review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EditorialCourseSummary"

  /editorial/courses/{courseId}:
    get:
      operationId: reviewCourse
      tags: [courses]
      summary: Review exact course draft and revision (editor or owner)
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Draft under review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialCourse"

  /editorial/lessons/{lessonId}:
    get:
      operationId: reviewLesson
      tags: [lessons]
      summary: Review exact lesson draft and revision (editor or owner)
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Draft under review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialLesson"

  /enrollments:
    get:
      operationId: listEnrollments
      tags: [enrollments]
      summary: List the current user's enrollments
      responses:
        "200":
          description: User's enrolled courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrollment"
    post:
      operationId: enrollInCourse
      tags: [enrollments]
      summary: Enroll in a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentInput"
      responses:
        "201":
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  /enrollments/{courseId}/progress:
    patch:
      operationId: updateProgress
      tags: [enrollments]
      summary: Update lesson progress for a course
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressUpdate"
      responses:
        "200":
          description: Progress updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  /announcements:
    get:
      operationId: listAnnouncements
      tags: [announcements]
      summary: List community announcements
      parameters:
        - in: query
          name: limit
          schema:
            type: number
          required: false
      responses:
        "200":
          description: Announcements list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Post a community announcement
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: UUID identifying this post attempt. Reuse it on retries; a different payload with the same key is rejected.
          schema:
            type: string
            pattern: '^[0-9a-fA-F-]{36}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Announcement posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "200":
          description: Previously posted announcement returned on retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "409":
          description: Request key already used for a different announcement

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the current user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/beauty-method:
    get:
      operationId: getBeautyMethod
      tags: [method]
      summary: Get the current member's beauty diagnostic and recommended method
      responses:
        "200":
          description: Personalized method, or an incomplete diagnostic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeautyMethod"
    put:
      operationId: saveBeautyDiagnostic
      tags: [method]
      summary: Save the beauty diagnostic and return the recommended method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeautyDiagnosticInput"
      responses:
        "200":
          description: Personalized method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeautyMethod"
        "401":
          description: Unauthorized

  /users/me/radiant-audit:
    get:
      operationId: getRadiantAudit
      tags: [method]
      summary: Get the signed-in member's Radiant Audit, if submitted
      responses:
        "200":
          description: The member's audit or null if it has not been submitted
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/RadiantAudit"
                  - type: "null"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteRadiantAudit
      tags: [method]
      summary: Permanently delete the signed-in member's current Radiant Audit, keeping earlier history
      responses:
        "204":
          description: Current Audit deleted; earlier submissions remain in history and are not promoted
        "401":
          description: Unauthorized
        "404":
          description: No current Audit for this member
    put:
      operationId: saveRadiantAudit
      tags: [method]
      summary: Submit or update the signed-in member's Radiant Audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadiantAuditInput"
      responses:
        "200":
          description: Saved audit and whether this was the account's first save or a retake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadiantAuditSaveResult"
        "400":
          description: Invalid audit answers
        "401":
          description: Unauthorized

  /users/me/radiant-audit/history:
    get:
      operationId: getRadiantAuditHistory
      tags: [method]
      summary: List the signed-in member's earlier Radiant Audit submissions, newest first
      responses:
        "200":
          description: Earlier submissions, excluding the current Audit
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RadiantAuditHistoryEntry"
        "401":
          description: Unauthorized
    delete:
      operationId: clearRadiantAuditHistory
      tags: [method]
      summary: Delete all earlier Audit submissions belonging to the signed-in member, without deleting the current Audit
      responses:
        "204":
          description: Earlier submissions deleted
        "401":
          description: Unauthorized

  /users/me/radiant-audit/history/{id}:
    delete:
      operationId: deleteRadiantAuditHistoryEntry
      tags: [method]
      summary: Delete one earlier Audit submission belonging to the signed-in member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Earlier submission deleted
        "400":
          description: Invalid submission ID
        "401":
          description: Unauthorized
        "404":
          description: Submission not found for this member

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get summary stats for the portal home dashboard
      responses:
        "200":
          description: Portal statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/featured:
    get:
      operationId: getFeaturedCourses
      tags: [dashboard]
      summary: Get featured and trending courses
      responses:
        "200":
          description: Featured courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent community activity feed
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    MembershipOffer:
      type: object
      required: [phase, foundingAvailable, foundingPrice, standardPrice]
      properties:
        phase: { type: string, enum: [upcoming, open, closed] }
        foundingAvailable: { type: boolean }
        foundingPrice: { type: number }
        standardPrice: { type: number }
    ConfirmedMembershipCounts:
      type: object
      required: [founding, standard]
      properties:
        founding: { type: number, minimum: 0, description: Whole count of confirmed founding members }
        standard: { type: number, minimum: 0, description: Whole count of confirmed standard members }
    MembershipCheckoutInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [founding, standard] }
    MembershipRedirect:
      type: object
      required: [url]
      properties:
        url: { type: string }
    MyMembership:
      type: object
      required: [membership]
      properties:
        membership:
          type: ["object", "null"]
          required: [kind, status, cancellationDate]
          properties:
            kind: { type: string, enum: [founding, standard] }
            status: { type: string, enum: [pending, confirmed, forfeited] }
            cancellationDate: { type: ["string", "null"], format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Category:
      type: object
      required: [id, name, slug, icon, courseCount]
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        description:
          type: ["string", "null"]
        courseCount:
          type: number

    Course:
      type: object
      required: [id, title, description, categoryId, categoryName, difficulty, instructorName, lessonCount, enrollmentCount, accessTier, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: string
        categoryId:
          type: number
        categoryName:
          type: string
        difficulty:
          type: string
        instructorName:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        lessonCount:
          type: number
        enrollmentCount:
          type: number
        accessTier:
          type: string
          enum: [Free, Elevated, Premium]
        transformationStory:
          type: ["string", "null"]
        isFeatured:
          type: boolean
        createdAt:
          type: string

    CourseDetail:
      type: object
      required: [id, title, description, categoryId, categoryName, difficulty, instructorName, lessonCount, enrollmentCount, accessTier, createdAt, lessons]
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: string
        categoryId:
          type: number
        categoryName:
          type: string
        difficulty:
          type: string
        instructorName:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        lessonCount:
          type: number
        enrollmentCount:
          type: number
        accessTier:
          type: string
          enum: [Free, Elevated, Premium]
        transformationStory:
          type: ["string", "null"]
        isFeatured:
          type: boolean
        createdAt:
          type: string
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/Lesson"

    CourseInput:
      type: object
      required: [title, description, categoryId, difficulty, instructorName]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        categoryId:
          type: number
        difficulty:
          type: string
        instructorName:
          type: string
        thumbnailUrl:
          type: string
        isFeatured:
          type: boolean
        accessTier:
          type: string
          enum: [Free, Elevated, Premium]
        transformationStory:
          type: string

    EditorialApproval:
      type: object
      required: [revision]
      properties:
        revision:
          type: string
          minLength: 64
          maxLength: 64

    EditorialCourse:
      allOf:
        - $ref: "#/components/schemas/Course"
        - type: object
          required: [revision, publishedAt]
          properties:
            revision: { type: string }
            publishedAt: { type: ["string", "null"] }

    EditorialCourseSummary:
      type: object
      required: [id, title, accessTier, publishedAt, lessons]
      properties:
        id: { type: number }
        title: { type: string }
        accessTier: { type: string, enum: [Free, Elevated, Premium] }
        publishedAt: { type: ["string", "null"] }
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/EditorialLessonSummary"

    EditorialLessonSummary:
      type: object
      required: [id, title, sortOrder, publishedAt]
      properties:
        id: { type: number }
        title: { type: string }
        sortOrder: { type: number }
        publishedAt: { type: ["string", "null"] }

    EditorialLesson:
      allOf:
        - $ref: "#/components/schemas/Lesson"
        - type: object
          required: [revision, publishedAt]
          properties:
            revision: { type: string }
            publishedAt: { type: ["string", "null"] }

    Lesson:
      type: object
      required: [id, courseId, title, sortOrder, durationMinutes, createdAt]
      properties:
        id:
          type: number
        courseId:
          type: number
        title:
          type: string
        content:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        sortOrder:
          type: number
        durationMinutes:
          type: number
        createdAt:
          type: string

    LessonInput:
      type: object
      required: [title, sortOrder, durationMinutes]
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        videoUrl:
          type: string
        sortOrder:
          type: number
        durationMinutes:
          type: number

    Enrollment:
      type: object
      required: [id, courseId, courseTitle, userId, completedLessons, totalLessons, enrolledAt]
      properties:
        id:
          type: number
        courseId:
          type: number
        courseTitle:
          type: string
        userId:
          type: string
        completedLessons:
          type: number
        completedLessonIds:
          type: array
          items:
            type: number
        totalLessons:
          type: number
        lastLessonId:
          type: ["number", "null"]
        enrolledAt:
          type: string

    EnrollmentInput:
      type: object
      required: [courseId]
      properties:
        courseId:
          type: number

    ProgressUpdate:
      type: object
      required: [lessonId]
      properties:
        lessonId:
          type: number

    Announcement:
      type: object
      required: [id, title, body, authorName, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        body:
          type: string
        authorName:
          type: string
        pinned:
          type: boolean
        createdAt:
          type: string

    AnnouncementInput:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
        pinned:
          type: boolean

    UserProfile:
      type: object
      required: [id, clerkId, displayName, email, membershipTier, createdAt]
      properties:
        id:
          type: number
        clerkId:
          type: string
        displayName:
          type: string
        email:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        membershipTier:
          type: string
          enum: [Free, Elevated, Premium]
        createdAt:
          type: string

    UserProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string

    RadiantAuditInput:
      type: object
      required: [routineChecks, valuesChecks, beautyTrend, masteryGoal, researchTime]
      properties:
        submissionId:
          type: string
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: Stable ID for one submission; reuse on retries, generate a new ID for a new retake.
        routineChecks:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum: [skincare-consistency, makeup-application-confidence, product-spending, trend-chasing-behavior, time-spent-on-beauty-daily]
        valuesChecks:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum: [quality-over-price, one-method-mastered, professional-results, authentic-expression, lasting-investment]
        beautyTrend:
          type: string
          minLength: 1
          maxLength: 1000
        masteryGoal:
          type: string
          minLength: 1
          maxLength: 1000
        researchTime:
          type: string
          minLength: 1
          maxLength: 1000

    RadiantAudit:
      allOf:
        - $ref: "#/components/schemas/RadiantAuditInput"
        - type: object
          required: [routineScore, valuesScore, completedAt]
          properties:
            routineScore:
              type: number
            valuesScore:
              type: number
            completedAt:
              type: string
              format: date-time

    RadiantAuditSaveResult:
      type: object
      required: [audit, completionKind]
      properties:
        audit:
          $ref: "#/components/schemas/RadiantAudit"
        completionKind:
          type: string
          enum: [first_time, retake]

    RadiantAuditHistoryEntry:
      allOf:
        - $ref: "#/components/schemas/RadiantAudit"
        - type: object
          required: [id]
          properties:
            id:
              type: number

    BeautyDiagnosticInput:
      type: object
      required: [skinType, undertone, featureNeeds, lifeStage, visibilityGoal]
      properties:
        skinType:
          type: string
          enum: [Dry, Balanced, Combination, Oily, Sensitive]
        undertone:
          type: string
          enum: [Cool, Neutral, Warm, Unsure]
        featureNeeds:
          type: array
          minItems: 1
          items:
            type: string
            enum: [Complexion, Eyes, Brows, Lips, Sculpting]
        lifeStage:
          type: string
          enum: [Starting fresh, Career growth, Entrepreneurship, Reinvention, Midlife evolution]
        visibilityGoal:
          type: string
          enum: [Everyday confidence, Camera ready, Executive presence, Personal brand, Special occasions]

    BeautyMethod:
      type: object
      required: [completed, methodName, methodSummary, focusAreas, sequence]
      properties:
        completed:
          type: boolean
        diagnostic:
          anyOf:
            - $ref: "#/components/schemas/BeautyDiagnosticInput"
            - type: "null"
        methodName:
          type: string
        methodSummary:
          type: string
        focusAreas:
          type: array
          items:
            type: string
        sequence:
          type: array
          items:
            $ref: "#/components/schemas/MethodStep"

    MethodStep:
      type: object
      required: [number, title, description, accessTier]
      properties:
        number:
          type: number
        title:
          type: string
        description:
          type: string
        accessTier:
          type: string
          enum: [Free, Elevated, Premium]

    DashboardStats:
      type: object
      required: [totalCourses, totalCategories, totalEnrollments, totalLessons, totalAnnouncements]
      properties:
        totalCourses:
          type: number
        totalCategories:
          type: number
        totalEnrollments:
          type: number
        totalLessons:
          type: number
        totalAnnouncements:
          type: number

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: number
        type:
          type: string
        description:
          type: string
        actorName:
          type: string
        entityTitle:
          type: string
        createdAt:
          type: string
